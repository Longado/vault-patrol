[project]
name = "vault-patrol"
version = "0.1.0"
description = "Event-driven agent that audits a markdown knowledge vault for rot and opens a subtraction-only PR."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "google-genai>=1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["patrol", "app"]
